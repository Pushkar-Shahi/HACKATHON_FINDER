name: Deploy to Cloudflare

# Production deploys run on every push to main. Required repository secrets:
#   CLOUDFLARE_API_TOKEN  – token with "Workers Scripts:Edit" and "D1:Edit"
#   CLOUDFLARE_ACCOUNT_ID – your Cloudflare account id
# Application secrets (BETTER_AUTH_SECRET, RESEND_API_KEY, ...) live in
# Cloudflare (`wrangler secret put`), never in GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Forward-only migrations; never resets or drops the production database.
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker + static assets
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          URL=$(node -e "const c=require('fs').readFileSync('wrangler.jsonc','utf8');const m=c.match(/\"BETTER_AUTH_URL\":\s*\"([^\"]+)\"/);console.log(m[1])")
          curl --fail --silent --show-error "$URL/api/health"
